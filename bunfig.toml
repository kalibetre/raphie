# Varlock owns private configuration; do not preload it into build/test processes.
env = false
telemetry = false

[run]
bun = true

[test]
timeout = 15000

[fmt]
printWidth = 80
tabWidth = 2
semi = true
singleQuote = false
sortImports = true
sortPackageJson = true
ignorePatterns = [
  ".data/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/.tanstack/**",
  "**/*routeTree.gen.ts",
  ".env*",
  "bun.lock",
]
