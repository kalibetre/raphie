name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/desktop --scratch-path "$RUNNER_TEMP/raphie-desktop-build"
      - run: sh apps/desktop/build-app.sh
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t raphie-workspace:slice2 packages/runtime/test/fixtures/container
      - run: bun run validate
