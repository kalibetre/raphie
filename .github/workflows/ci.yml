name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t raphie-workspace:slice2 packages/runtime/test/fixtures/container
      - run: bun run validate

  # The Rust desktop client (apps/desktop). A separate job, so it runs beside
  # `validate` instead of lengthening it.
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # Rune links libxkbcommon and libwayland-client on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      # rustup reads apps/desktop/rust-toolchain.toml and installs that toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
