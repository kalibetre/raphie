name: Prepare release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t raphie-workspace:slice2 packages/runtime/test/fixtures/container
      - run: bun run validate

  build:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: raphie-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: raphie-linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]'
      - name: Build release binaries
        run: sh scripts/build-standalone.sh '${{ matrix.target }}' "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-1-0 curl python3
      - name: Verify compiled service
        run: sh scripts/standalone-integration.sh "$(pwd)/dist/standalone/${{ matrix.target }}"
      - name: Verify local installation lifecycle
        run: |
          docker run --rm -e RAPHIE_DISPOSABLE_TEST=1 \
            -v "$(pwd)/dist/standalone/${{ matrix.target }}:/binaries:ro" \
            -v "$(pwd)/scripts/linux-binary/container-integration.py:/test.py:ro" \
            -v "$(pwd)/scripts/linux-binary/bootstrap.sh:/test-bootstrap/bootstrap.sh:ro" \
            -v "$(pwd)/scripts/linux-binary/download-release.sh:/test-bootstrap/download-release.sh:ro" \
            ubuntu:24.04 sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends age dbus gnome-keyring libsecret-1-0 python3 >/dev/null && python3 /test.py'
      - name: Verify unprivileged user installation
        run: |
          docker run --rm -e RAPHIE_DISPOSABLE_TEST=1 \
            -v "$(pwd)/dist/standalone/${{ matrix.target }}:/binaries:ro" \
            -v "$(pwd)/scripts/install.sh:/installer:ro" \
            -v "$(pwd)/scripts/user-install-integration.sh:/check:ro" \
            ubuntu:24.04 sh /check
      - name: Package release binaries
        run: tar -C 'dist/standalone/${{ matrix.target }}' -czf '${{ matrix.asset }}' raphie raphie-runtime raphie-web install.sh raphie.service raphie-admin keyring-session.sh update.sh restore.sh uninstall.sh recovery-key.py bundle-id.sh download-release.sh
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.target }}"
          path: "${{ matrix.asset }}"

  build-macos:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-15
            asset: raphie-darwin-arm64.tar.gz
          - target: bun-darwin-x64
            runner: macos-15-intel
            asset: raphie-darwin-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build release binaries
        run: sh scripts/build-standalone.sh '${{ matrix.target }}' "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
      - name: Verify compiled workspace worker
        run: dist/standalone/${{ matrix.target }}/raphie-smoke
      - name: Package release binaries
        run: COPYFILE_DISABLE=1 tar -C 'dist/standalone/${{ matrix.target }}' -czf '${{ matrix.asset }}' raphie raphie-runtime raphie-web
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.target }}"
          path: "${{ matrix.asset }}"

  draft:
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bun-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cp scripts/install.sh artifacts/install.sh
          cd artifacts && sha256sum raphie-linux-x64.tar.gz raphie-linux-arm64.tar.gz raphie-darwin-x64.tar.gz raphie-darwin-arm64.tar.gz install.sh > SHA256SUMS
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-alpha.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/raphie-linux-x64.tar.gz artifacts/raphie-linux-arm64.tar.gz artifacts/raphie-darwin-x64.tar.gz artifacts/raphie-darwin-arm64.tar.gz artifacts/install.sh artifacts/SHA256SUMS --verify-tag --draft --generate-notes "${flags[@]}"
