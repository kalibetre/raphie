name: Prepare release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      nightly: ${{ steps.release.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo 'nightly=false' >> "$GITHUB_OUTPUT"
          else
            base_version=$(cat VERSION)
            [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "version=v${base_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo 'nightly=true' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker build -t raphie-workspace:slice2 packages/runtime/test/fixtures/container
      - run: bun run validate

  build:
    needs: [metadata, validate]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: raphie-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: raphie-linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: sh scripts/build-standalone.sh '${{ matrix.target }}' "$RELEASE_VERSION" "$(git rev-parse HEAD)"
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-1-0 curl python3
      - name: Verify compiled service
        run: sh scripts/standalone-integration.sh "$(pwd)/dist/standalone/${{ matrix.target }}"
      - name: Verify local installation lifecycle
        run: |
          docker run --rm -e RAPHIE_DISPOSABLE_TEST=1 \
            -v "$(pwd)/dist/standalone/${{ matrix.target }}:/binaries:ro" \
            -v "$(pwd)/scripts/linux-binary/container-integration.py:/test.py:ro" \
            -v "$(pwd)/scripts/linux-binary/bootstrap.sh:/test-bootstrap/bootstrap.sh:ro" \
            -v "$(pwd)/scripts/linux-binary/download-release.sh:/test-bootstrap/download-release.sh:ro" \
            ubuntu:24.04 sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends age dbus gnome-keyring libsecret-1-0 python3 >/dev/null && python3 /test.py'
      - name: Verify unprivileged user installation
        run: |
          docker run --rm -e RAPHIE_DISPOSABLE_TEST=1 \
            -v "$(pwd)/dist/standalone/${{ matrix.target }}:/binaries:ro" \
            -v "$(pwd)/scripts/install.sh:/installer:ro" \
            -v "$(pwd)/scripts/user-install-integration.sh:/check:ro" \
            ubuntu:24.04 sh /check
      - name: Package release binaries
        run: tar -C 'dist/standalone/${{ matrix.target }}' -czf '${{ matrix.asset }}' raphie raphie-runtime raphie-web install.sh raphie.service raphie-admin keyring-session.sh update.sh restore.sh uninstall.sh recovery-key.py bundle-id.sh download-release.sh
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.target }}"
          path: "${{ matrix.asset }}"

  build-macos:
    needs: [metadata, validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-15
            asset: raphie-darwin-arm64.tar.gz
          - target: bun-darwin-x64
            runner: macos-15-intel
            asset: raphie-darwin-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: sh scripts/build-standalone.sh '${{ matrix.target }}' "$RELEASE_VERSION" "$(git rev-parse HEAD)"
      - name: Verify compiled workspace worker
        run: dist/standalone/${{ matrix.target }}/raphie-smoke
      - name: Package release binaries
        run: COPYFILE_DISABLE=1 tar -C 'dist/standalone/${{ matrix.target }}' -czf '${{ matrix.asset }}' raphie raphie-runtime raphie-web
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.target }}"
          path: "${{ matrix.asset }}"

  draft:
    needs: [metadata, build, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bun-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cp scripts/install.sh artifacts/install.sh
          cd artifacts && sha256sum raphie-linux-x64.tar.gz raphie-linux-arm64.tar.gz raphie-darwin-x64.tar.gz raphie-darwin-arm64.tar.gz install.sh > SHA256SUMS
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          NIGHTLY: ${{ needs.metadata.outputs.nightly }}
        run: |
          files=(artifacts/raphie-linux-x64.tar.gz artifacts/raphie-linux-arm64.tar.gz artifacts/raphie-darwin-x64.tar.gz artifacts/raphie-darwin-arm64.tar.gz artifacts/install.sh artifacts/SHA256SUMS)
          if [[ "$NIGHTLY" == true ]]; then
            gh release create "$RELEASE_VERSION" "${files[@]}" --target "$GITHUB_SHA" --prerelease --title "Raphie ${RELEASE_VERSION} (${GITHUB_SHA:0:12})" --notes "Automated build of commit $GITHUB_SHA."
          else
            gh release create "$RELEASE_VERSION" "${files[@]}" --verify-tag --draft --generate-notes
          fi
