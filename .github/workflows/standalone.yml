name: Experimental standalone builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "bun.lock"
      - ".github/workflows/standalone.yml"

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build standalone artifacts
        run: sh scripts/build-standalone.sh '${{ matrix.target }}' ci "${GITHUB_SHA}"
      - name: Install integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-1-0 curl python3
      - name: Exercise compiled service
        run: sh scripts/standalone-integration.sh "$(pwd)/dist/standalone/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.target }}
          path: |
            dist/standalone/${{ matrix.target }}/raphie
            dist/standalone/${{ matrix.target }}/raphie-runtime
            dist/standalone/${{ matrix.target }}/raphie-web
          retention-days: 7
