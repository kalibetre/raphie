name: Docs

# Builds the Starlight site in apps/docs from docs/ and deploys it to
# Cloudflare Workers static assets. Pull requests only build it.
on:
  push:
    branches: [main]
    paths: [docs/**, apps/docs/**, bun.lock, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, apps/docs/**, bun.lock, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
