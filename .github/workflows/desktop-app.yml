name: Desktop app

# Builds the macOS disk image the release workflow publishes, on pull
# requests that touch the desktop client, so a broken package shows up
# before a release. The image is kept as a run artifact for trying out.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "VERSION"
      - ".github/workflows/desktop-app.yml"

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # rustup reads apps/desktop/rust-toolchain.toml and installs that toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: scripts/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Raphie-macos-arm64
          path: apps/desktop/target/dist/Raphie-macos-arm64.dmg
          retention-days: 7
