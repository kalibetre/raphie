[package]
name = "raphie-desktop-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Raphie's desktop client core: API client, sign-in, event streams and state. No UI framework."

[lib]
name = "raphie_core"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in the order the runtime sent them, so
# tool arguments read as they were written.
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# The OS credential store: Keychain on macOS, Credential Manager on Windows,
# the Secret Service (over D-Bus) on Linux.
# Version 4's default `v1` feature keeps version 3's `Entry` and stores, so
# saved sign-ins stay where they were.
keyring = "4.2"
dirs = "7"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
] }
tokio-stream = { version = "0.1", features = ["sync"] }

[lints]
workspace = true
